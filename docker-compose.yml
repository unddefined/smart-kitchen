services:
  backend:
    image: crpi-obg02yu23b1k3mun-vpc.cn-wulanchabu.personal.cr.aliyuncs.com/walker-11572/smart-kitchen-backend:latest
    container_name: smart-kitchen-backend-prod
    env_file:
      - .env.production
    environment:
      # 直接使用 env_file 中的 DATABASE_URL，无需重复定义
      NODE_ENV: production
      PORT: 3001
      # 设置时区为中国标准时间
      TZ: Asia/Shanghai
    ports:
      - "3001:3001"
    volumes:
      # 挂载主机时区配置，确保容器时间与主机一致
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - backend-network
    # 日志配置 - 限制日志大小和数量，防止磁盘占用过大
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # 每个日志文件最大 10MB
        max-file: "3"    # 最多保留 3 个日志文件
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 移除独立的 nginx 服务，让前端容器直接暴露 80 端口
  frontend:
    image: crpi-obg02yu23b1k3mun-vpc.cn-wulanchabu.personal.cr.aliyuncs.com/walker-11572/smart-kitchen-frontend:latest
    container_name: smart-kitchen-frontend-prod
    ports:
      - "80:80" # 直接暴露前端容器的 80 端口
    restart: unless-stopped
    networks:
      - backend-network
    depends_on:
      - backend
    # 日志配置 - 限制日志大小和数量
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # 每个日志文件最大 10MB
        max-file: "3"    # 最多保留 3 个日志文件

networks:
  backend-network:
